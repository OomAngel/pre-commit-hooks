[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-pre-commit-hooks"
version = "1.0.1"
description = "Shared pre-commit hooks for ~/dev repos (guard, gitleaks, deep-QC)"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["pre_commit_hooks"]
